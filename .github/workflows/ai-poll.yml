name: touni-ai-poll
# Déclenche le poller de l'agent IA WhatsApp toutes les ~5 min (limite GitHub Actions).
# En phase TEST, l'endpoint est restreint au numéro du marchand (env EGROW_ONLY) → inoffensif.
# Le mot de passe est dans le GitHub Secret AI_REPLY_SECRET (jamais dans le dépôt, qui est public).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger agent poll
        env:
          AI_REPLY_SECRET: ${{ secrets.AI_REPLY_SECRET }}
        run: |
          curl -s "https://touni-retour.vercel.app/api/ai-reply?secret=${AI_REPLY_SECRET}&poll=1" -o /dev/null -w "poll HTTP %{http_code}\n"
