<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inventaire — Touni</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#151515;--muted:#6b7280;--border:#e5e7eb;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--orange:#ea580c;--radius:12px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);margin:0;padding:12px;max-width:820px;margin:0 auto;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:10}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;font-weight:800}
.navlink{font-size:12px;font-weight:700;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 13px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;flex:1;min-width:70px;text-align:center}
.stat b{display:block;font-size:17px}
.stat.warn{color:var(--orange);border-color:#fed7aa}
.stat.gh{color:var(--red);border-color:#fecaca}
.search{width:100%;margin-top:10px;padding:13px 14px;font-size:16px;border:2px solid var(--border);border-radius:12px;font-family:var(--font);background:var(--card);color:var(--text)}
.search:focus{outline:none;border-color:var(--blue)}
.actions{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:11px;border:none;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font)}
.btn.add{background:var(--green);color:#fff}
.btn.rec{background:var(--text);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--border);color:var(--muted);flex:0 0 auto;padding:11px 14px}
.hint{color:var(--muted);font-size:13px;text-align:center;padding:26px 12px}
.row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 11px;margin-top:9px;display:flex;align-items:center;gap:10px}
.row.match{border-color:var(--green);box-shadow:0 0 0 2px #dcfce7 inset}
.row.over{border-color:var(--orange);box-shadow:0 0 0 2px #ffedd5 inset}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#eef0f2;flex:0 0 auto}
.info{flex:1;min-width:0}
.pname{font-size:13px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sz{background:var(--text);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800}
.cnt{font-weight:800}
.cnt.pos{color:var(--green)}
.cnt.over{color:var(--orange)}
.ctrl{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.pm{width:34px;height:38px;border:1px solid var(--border);background:var(--card);border-radius:9px;font-size:19px;font-weight:800;cursor:pointer;color:var(--text)}
.plus{width:52px;height:44px;border:none;background:var(--blue);color:#fff;border-radius:11px;font-size:22px;font-weight:800;cursor:pointer}
.big{font-size:18px}
.fix{font-size:11px;font-weight:700;color:var(--orange);background:#fff7ed;border:1px solid #fed7aa;border-radius:7px;padding:4px 7px;cursor:pointer;margin-left:auto}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.sheet h2{font-size:16px;margin:2px 0 10px}
.sheet .close{float:right;font-size:22px;border:none;background:none;cursor:pointer;color:var(--muted)}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:10px 0 4px}
input.f,select.f{width:100%;padding:11px;font-size:15px;border:1px solid var(--border);border-radius:10px;font-family:var(--font);background:var(--card);color:var(--text)}
.szpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.szpick button{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer;color:var(--text)}
.szpick button.on{background:var(--text);color:#fff;border-color:var(--text)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border:1px solid var(--border);background:var(--card);border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;color:var(--text)}
.seg button.on{background:var(--text);color:#fff}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:.2s;z-index:99}
.toast.show{opacity:1}
.mini{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📋 Inventaire</h1>
    <a class="navlink" href="/commandes-stock">← Retour</a>
  </div>
  <div class="stats" id="stats"></div>
  <input class="search" id="q" placeholder="🔎 Cherche un produit (ex: real madrid, brésil, casquette)…" autocomplete="off">
  <div class="actions">
    <button class="btn add" id="addBtn">➕ Ajouter (introuvable)</button>
    <button class="btn rec" id="recBtn">✅ Clôturer / Écarts</button>
    <button class="btn ghost" id="mergeBtn" title="Fusionner les lignes en double (même produit + même taille)">🧹</button>
    <button class="btn ghost" id="resetBtn" title="Réinitialiser le comptage">↺</button>
  </div>
</header>

<div id="list"></div>
<div class="hint" id="hint">Tape le nom d'un produit pour le pointer. Chaque unité physique = un appui sur <b>+</b>.</div>

<!-- Ajout -->
<div class="ov" id="addOv">
  <div class="sheet">
    <button class="close" onclick="closeAdd()">×</button>
    <h2>➕ Ajouter au stock</h2>
    <label>Produit</label>
    <input class="f" id="aProd" list="prodList" placeholder="Nom du produit">
    <datalist id="prodList"></datalist>
    <label>Taille</label>
    <div class="szpick" id="szPick"></div>
    <input class="f" id="aSize" placeholder="ou taille libre" style="margin-top:6px">
    <label>Quantité</label>
    <input class="f" id="aQty" type="number" value="1" min="1" inputmode="numeric">
    <button class="btn add" style="width:100%;margin-top:14px;padding:13px" onclick="doAdd()">Ajouter au stock</button>
  </div>
</div>

<!-- Réconciliation -->
<div class="ov" id="recOv">
  <div class="sheet">
    <button class="close" onclick="closeRec()">×</button>
    <h2>Réconciliation</h2>
    <div class="seg">
      <button data-t="ghost" class="on">👻 Fantômes <span id="cGhost"></span></button>
      <button data-t="ecart">⚖️ Écarts <span id="cEcart"></span></button>
    </div>
    <div class="mini" id="recDesc"></div>
    <div id="recList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SECRET='touni-sync-2026';
const API='/api/notifications';
let ROWS=[], BYID={};
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),1600);}
function norm(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}

async function load(){
  const r=await fetch(`${API}?inv=list&secret=${SECRET}`);
  const j=await r.json();
  ROWS=j.rows||[]; BYID={}; ROWS.forEach(x=>BYID[x.id]=x);
  // datalist produits
  const dl=$('#prodList'); dl.innerHTML=(j.products||[]).map(p=>`<option value="${esc(p)}">`).join('');
  renderStats(); render();
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderStats(){
  const lines=ROWS.length;
  const counted=ROWS.filter(r=>r.counted_at).length;
  const cu=ROWS.reduce((a,r)=>a+(r.counted_qty||0),0);
  const ph=ROWS.filter(r=>(r.qty||0)>0 && !r.counted_at).length;
  const ec=ROWS.filter(r=>r.counted_at && (r.counted_qty||0)!==(r.qty||0)).length;
  $('#stats').innerHTML=`
    <div class="stat"><b>${counted}/${lines}</b>lignes pointées</div>
    <div class="stat"><b>${cu}</b>unités comptées</div>
    <div class="stat gh"><b>${ph}</b>fantômes</div>
    <div class="stat warn"><b>${ec}</b>écarts</div>`;
  $('#cGhost').textContent=`(${ph})`; $('#cEcart').textContent=`(${ec})`;
}

function render(){
  const q=norm($('#q').value.trim());
  const list=$('#list'), hint=$('#hint');
  if(!q){ list.innerHTML=''; hint.style.display='block'; return; }
  hint.style.display='none';
  const terms=q.split(/\s+/);
  const res=ROWS.filter(r=>{const t=norm(r.product+' '+(r.size||''));return terms.every(w=>t.indexOf(w)!==-1);}).slice(0,80);
  if(!res.length){ list.innerHTML=`<div class="hint">Aucune ligne « ${esc($('#q').value)} » dans le stock.<br><b>→ Appuie sur « ➕ Ajouter » pour le rentrer.</b></div>`; return; }
  list.innerHTML=res.map(rowHtml).join('');
}
function rowHtml(r){
  const rec=r.qty||0, c=r.counted_qty||0;
  let cls='', badge='';
  if(r.counted_at){ if(c===rec){cls='match';} else if(c>rec){cls='over';} }
  const cc=c>rec?'over':(c>0?'pos':'');
  const over=c>rec?`<span class="fix" onclick="adjust('${r.id}',${c})">→ mettre stock à ${c}</span>`:'';
  const img=r.image?`<img class="thumb" src="${esc(r.image)}" loading="lazy" onerror="this.style.visibility='hidden'">`:`<div class="thumb"></div>`;
  return `<div class="row ${cls}" id="r_${r.id}">
    ${img}
    <div class="info">
      <div class="pname">${esc(r.product)}</div>
      <div class="meta">${r.size?`<span class="sz">${esc(r.size)}</span>`:''}
        <span>stock: <b>${rec}</b></span>
        <span>compté: <span class="cnt ${cc}" id="c_${r.id}">${c}</span></span>${over}</div>
    </div>
    <div class="ctrl">
      <button class="pm" onclick="count('${r.id}',-1)">−</button>
      <button class="plus" onclick="count('${r.id}',1)">+</button>
    </div>
  </div>`;
}

async function count(id,delta){
  const r=BYID[id]; if(!r) return;
  const prev=r.counted_qty||0; const next=Math.max(0,prev+delta);
  r.counted_qty=next; if(next>0||delta>0) r.counted_at=r.counted_at||new Date().toISOString();
  // maj visuelle immédiate
  const el=$('#c_'+id); if(el){el.textContent=next; el.className='cnt '+(next>(r.qty||0)?'over':(next>0?'pos':''));}
  const rowEl=$('#r_'+id); if(rowEl){rowEl.className='row '+(r.counted_at?(next===(r.qty||0)?'match':(next>(r.qty||0)?'over':'')):'' );}
  renderStats();
  try{ await fetch(`${API}?action=inv_count&secret=${SECRET}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,delta})}); }
  catch(e){ toast('⚠️ réseau'); }
  render();
}
async function adjust(id,qty){
  const r=BYID[id]; if(!r) return;
  r.qty=qty;
  try{ await fetch(`${API}?action=inv_adjust&secret=${SECRET}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,qty})}); toast('✅ stock ajusté à '+qty);}catch(e){toast('⚠️ réseau');}
  renderStats(); render(); if($('#recOv').classList.contains('open')) renderRec();
}

/* ── Ajout ── */
let addSize='';
function openAdd(){
  $('#aProd').value=$('#q').value.trim(); $('#aSize').value=''; $('#aQty').value=1; addSize='';
  $('#szPick').innerHTML=['S','M','L','XL','XXL','Unique'].map(s=>`<button onclick="pickSize('${s}',this)">${s}</button>`).join('');
  $('#addOv').classList.add('open');
}
function closeAdd(){$('#addOv').classList.remove('open');}
function pickSize(s,btn){addSize=s;[...document.querySelectorAll('#szPick button')].forEach(b=>b.classList.remove('on'));btn.classList.add('on');$('#aSize').value='';}
async function doAdd(){
  const product=$('#aProd').value.trim();
  const size=$('#aSize').value.trim()||addSize;
  const qty=Math.max(1,parseInt($('#aQty').value||'1',10));
  if(!product){toast('Nom du produit ?');return;}
  try{
    const r=await fetch(`${API}?action=inv_add&secret=${SECRET}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product,size,qty})});
    const j=await r.json();
    if(j.row){ ROWS.push(j.row); BYID[j.row.id]=j.row; }
    toast('✅ Ajouté au stock');
    closeAdd(); $('#q').value=product; renderStats(); render();
  }catch(e){toast('⚠️ échec ajout');}
}

/* ── Réconciliation ── */
let recTab='ghost';
function openRec(){recTab='ghost';[...document.querySelectorAll('.seg button')].forEach(b=>b.classList.toggle('on',b.dataset.t==='ghost'));$('#recOv').classList.add('open');renderRec();}
function closeRec(){$('#recOv').classList.remove('open');}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{recTab=b.dataset.t;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));renderRec();});
function renderRec(){
  const box=$('#recList'); const desc=$('#recDesc');
  if(recTab==='ghost'){
    const gh=ROWS.filter(r=>(r.qty||0)>0 && !r.counted_at).sort((a,b)=>norm(a.product).localeCompare(norm(b.product)));
    desc.innerHTML=`Lignes <b>encore en stock mais jamais pointées</b> = probablement plus dans le dépôt. Vérifie, puis mets à 0.`;
    box.innerHTML=(gh.length?`<button class="btn ghost" style="width:100%;margin:8px 0;color:var(--red);border-color:#fecaca" onclick="zeroAll()">Tout mettre à 0 (${gh.length})</button>`:'')+
      (gh.map(r=>recItem(r,`<span class="fix" style="color:var(--red);background:#fef2f2;border-color:#fecaca" onclick="adjust('${r.id}',0)">Mettre à 0</span>`)).join('')||'<div class="hint">Aucun fantôme 🎉</div>');
  } else {
    const ec=ROWS.filter(r=>r.counted_at && (r.counted_qty||0)!==(r.qty||0)).sort((a,b)=>norm(a.product).localeCompare(norm(b.product)));
    desc.innerHTML=`Lignes où le <b>compté ≠ stock enregistré</b>. Ajuste le stock sur le compté physique.`;
    box.innerHTML=ec.map(r=>recItem(r,`<span class="fix" onclick="adjust('${r.id}',${r.counted_qty||0})">stock → ${r.counted_qty||0}</span>`)).join('')||'<div class="hint">Aucun écart 👍</div>';
  }
}
function recItem(r,btn){
  return `<div class="row">
    <div class="info"><div class="pname">${esc(r.product)}</div>
    <div class="meta">${r.size?`<span class="sz">${esc(r.size)}</span>`:''}<span>stock: <b>${r.qty||0}</b></span><span>compté: <b>${r.counted_qty||0}</b></span></div></div>
    ${btn}</div>`;
}
async function zeroAll(){
  const gh=ROWS.filter(r=>(r.qty||0)>0 && !r.counted_at);
  if(!confirm(`Mettre à 0 les ${gh.length} lignes jamais pointées ?`))return;
  for(const r of gh){ await adjust(r.id,0); }
  toast('✅ Fantômes mis à 0'); renderRec();
}
async function resetAll(){
  if(!confirm('Réinitialiser TOUT le comptage (remettre « compté » à 0 partout) ? Le stock enregistré n\'est pas touché.'))return;
  await fetch(`${API}?action=inv_reset&secret=${SECRET}`,{method:'POST'});
  toast('↺ Comptage réinitialisé'); load();
}

async function mergeDup(){
  if(!confirm('Fusionner les lignes en double (même produit + même taille) en une seule, en additionnant les quantités ?'))return;
  try{
    const r=await fetch(`${API}?action=inv_merge&secret=${SECRET}`,{method:'POST'});
    const j=await r.json();
    toast(j.removed>0?`🧹 ${j.removed} lignes rangées`:'✅ Aucun doublon');
    await load();
  }catch(e){toast('⚠️ échec');}
}
$('#q').addEventListener('input',render);
$('#addBtn').onclick=openAdd;
$('#mergeBtn').onclick=mergeDup;
$('#recBtn').onclick=openRec;
$('#resetBtn').onclick=resetAll;
load();
</script>
</body>
</html>
